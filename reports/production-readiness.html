  :root{--bg:#0b0f17;--card:#131a26;--card2:#0f1521;--ink:#e6edf6;--mut:#8aa0b8;--line:#223047;
    --a:#4ea1ff;--b:#37d39a;--c:#ffb454;--d:#ff6b8b;--e:#a98bff;--ok:#37d39a;--warn:#ffb454;--bad:#ff6b8b;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 22px 80px}
  h1{font-size:26px;margin:0 0 4px} h2{font-size:19px;margin:38px 0 14px;border-bottom:1px solid var(--line);padding-bottom:8px}
  h3{font-size:15px;margin:20px 0 8px;color:var(--mut);font-weight:600}
  .sub{color:var(--mut);margin:0 0 22px;font-size:13px}
  .verdict{background:linear-gradient(135deg,#10202e,#131a26);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin:18px 0 8px}
  .verdict .badge{display:inline-block;font-weight:700;font-size:13px;padding:4px 12px;border-radius:999px;background:rgba(55,211,154,.15);color:var(--ok);border:1px solid rgba(55,211,154,.4)}
  .verdict .badge.warn{background:rgba(255,180,84,.15);color:var(--warn);border-color:rgba(255,180,84,.45)}
  .verdict p{margin:12px 0 0;color:#cdd9e8}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:18px 0}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .kpi .v{font-size:26px;font-weight:700;letter-spacing:-.3px} .kpi .l{color:var(--mut);font-size:12px;margin-top:3px}
  .kpi .v.ok{color:var(--ok)} .kpi .v.warn{color:var(--warn)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .panel.full{grid-column:1/-1}
  canvas{max-height:300px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  thead th{color:var(--mut);font-weight:600;font-size:12px}
  tbody tr:hover{background:rgba(78,161,255,.06)}
  .note{color:var(--mut);font-size:12px;margin-top:10px}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
  code{background:var(--card2);padding:1px 6px;border-radius:5px;color:#cfe3ff;font-size:12px}
  .miss{color:var(--mut);font-style:italic;padding:14px}
  ul{margin:10px 0 0;padding-left:18px;color:#cdd9e8} li{margin:4px 0}

Зогсох нөхцөл\n        return 1\n    else:\n        return n * factorial(n - 1) # Өөрийгөө дахин дуудах\n\nprint(factorial(5)) # Үр дүн: 120\n```"},{"id":"g14","task":"general","question":"Татварын орлого гэж юу вэ? Энгийнээр тайлбарла.","injected":null,"source":null,"output":"Татварын орлого гэдэг нь төрөөс иргэн болон аж ахуйн нэгжүүдээс хуулиар тогтоосон татварыг цуглуулж, улс орны нийлүүлэлт, нийгэм, эдийн засгийн хэрэгцээг (жишээ нь: зам, гүүр, эмнэлэг, сургууль, цагийн хөлс) санхүүжүүлэхэд ашигладаг мөнгөн орлогыг хэлнэ. \n\nЭнгийнээр хэлбэл, улс төрөөс иргэдийнхээ орлого, бизнес, бараа бүтээгдэхүүнээс тодорхой хэмжээний мөнгө авч, түүгээрээ нийт олны хэрэгцээг хангахыг хэлнэ."},{"id":"g15","task":"general","question":"Усны эргэлт (water cycle) гэж юу вэ?","injected":null,"source":null,"output":"Усны эргэлт гэдэг нь дэлхий дээрх ус уурандшиж, тэсрэлт хийж, дахин хүрэн буурах замаар дараах үе шатуудаар тасралтгүй эргэлдэх процесс юм. Үүнд голчлон уурандшилт, конденсаци (унтралт) болон тунадас гэсэн үйл явцууд багтдаг."},{"id":"g16","task":"general","question":"Цаг агаар, уур амьсгал хоёрын ялгааг тайлбарлаач.","injected":null,"source":null,"output":"Цаг агаар нь тодорхой нэгэн газар, богино хугацааны (минут, цаг, өдрөөр) уур агаарын төлөв байдлыг хэлдэг бол уур амьсгал нь тухайн бүс нутгийн олон жилийн (дужинаар) туршдаа тогтсон дундаж төлөв байдлыг хэлнэ. Товчоор хэлбэл, цаг агаар бол \"одоо ямар байна\", харин уур амьсгал бол \"ер нь ямар байдаг\" гэсэн ялгаатай."},{"id":"g17","task":"general","question":"Хиймэл оюун ухаан гэж юу вэ? Хоёр өгүүлбэрээр тайлбарла.","injected":null,"source":null,"output":"Хиймэл оюун ухаан гэдэг нь компьютерыг хүнийхээ адил суралцах, дүгнэлт гаргах болон асуудлыг шийдвэрлэх чадвартай болгох технологи юм. Энэ нь өгөгдөлд дүн шинжилгээ хийж, ухаалаг хариу үйлдэл үзүүлэх замаар хүний ажлыг хөнгөвчилж, автоматжуулдаг."},{"id":"g18","task":"general","question":"Хиймэл оюун ухаан гэж юу вэ? Хоёр өгүүлбэрээр тайлбарла.","injected":null,"source":null,"output":"Хиймэл оюун ухаан гэдэг нь компьютерыг хүний мэт сэтгэх, суралцах болон асуудлыг шийдвэрлэх чадвартай болгох технологи юм. Энэ нь өгөгдөлд дүнлэлт хийж, хэв шинжийг таньж, бие даан шийдвэр гаргах замаар хүний ажлыг хөнгөвчилж байдаг."},{"id":"g19","task":"general","question":"Усны эргэлт (water cycle) гэж юу вэ?","injected":null,"source":null,"output":"Усны эргэлт гэдэг нь дэлхий дээрх усны урсгал, хуримтлал болон ууршилт гэх мэт байдлаар дагшин хэлбэрээ сольж, дахин давтагдах тасралтгүй үйл явц юм. Энэ нь нарны энергиор хөтлөгдөж, усыг ууршуулан, үүл болгож, дараа нь бороо, цас болон буцаж дэлхий рүү буулгах замаар явагддаг."},{"id":"g20","task":"general","question":"Рекурс (recursion) гэж юу вэ? Богино жишээтэйгээр тайлбарла.","injected":null,"source":null,"output":"Рекурс (recursion) гэдэг нь функц өөрийгөө дахин дуудахыг хэлнэ. Энэ нь том асуудлыг жижиг, ижил төстэй хэсгүүдэд хувааж шийдвэрлэхэд ашиглагддаг. Рекурс функц заавал \"зогсох нөхцөл\" (base case)тэй байх ёстой, эсрэгээрээ бол програм хязгааргүй давтагдаж алдаа заана.\n\n**Жишээ: Факториал тооцоолол (n!)**\n5! = 5 × 4 × 3 × 2 × 1 гэдгийг рекурсаар ингэж бодно:\n\n```python\ndef factorial(n):\n    if n == 1: # Зогсох нөхцөл\n        return 1\n    else:\n        return n * factorial(n - 1) # Өөрийгөө дахин дуудах\n\nprint(factorial(5)) # Үр дүн: 120\n```\nЭнд `factorial(5)` нь `5 * factorial(4)`-ийг дуудаж, тэр нь дараагийнхыг дуудан, эцэст нь `n == 1` болох үед тооцоолол эргэн буцаж гүйцэлдэнэ."},{"id":"x21","task":"xsum","question":"Дээрх англи баримт бичгийг Монгол хэлээр 3-4 өгүүлбэрээр товчилж бичээч.","injected":null,"source":"[doc:a21754b7]\n\n## vLLM — PagedAttention, batching and chunked prefill\nvLLM achieves high serving throughput through PagedAttention, which efficiently manages attention key/value memory, plus continuous batching of incoming requests, chunked prefill, and prefix caching. Chunked prefill improves inter-token latency (ITL) and decode by prioritizing decode requests and batching compute-bound prefill with memory-bound decode. Tuning max_num_batched_tokens trades off TTFT and ITL: smaller values improve ITL, larger values improve TTFT; values above 8192 are recommended for throughput on large GPUs.\n\n## Next.js — Server Actions for mutations\nMutations should be handled by Server Actions, invoked from a \u003cform> so they only run on explicit user interaction (never as a side effect of rendering). This keeps mutation logic on the server and avoids accidental writes during render.\n\nimport { logout } from './actions'\nexport default function Page() {\n  return (\u003c>\u003cUserProfile />\u003cform action={logout}>\u003cbutton type=\"submit\">Logout\u003c/button>\u003c/form>\u003c/>)\n}\n\n## React — Built-in hook categories\nReact's built-in Hooks fall into categories. State Hooks: useState (direct updates) and useReducer (update logic in a reducer). Context Hooks: useContext reads and subscribes to a context. Ref Hooks: useRef and useImperativeHandle. Effect Hooks: useEffect connects to external systems, useLayoutEffect fires before paint, useInsertionEffect for libraries injecting CSS. Performance Hooks: useMemo caches expensive results, useCallback caches function definitions, useTransition and useDeferredValue keep the UI responsive. Other Hooks: useId, useSyncExternalStore, useActionState.\n\n## vLLM — Tensor parallelism\nTensor parallelism shards model parameters across multiple GPUs within each layer, which is essential for models too large to fit on a single GPU. Set tensor_parallel_size to the number of GPUs.\n\nfrom vllm import LLM\nllm = LLM(model=\"meta-llama/Llama-3.3-70B-Instruct\", tensor_parallel_size=4)\n\n## Next.js — Route handler with error handling\nA POST route handler should wrap work in try/catch, return appropriate HTTP status codes, and avoid leaking sensitive error detail to clients.\n\nimport { submit } from '@/lib/submit'\nexport async function POST(request: Request) {\n  try {\n    await submit(request)\n    return new Response(null, { status: 204 })\n  } catch (reason) {\n    const message = reason instanceof Error ? reason.message : 'Unexpected error'\n    return new Response(message, { status: 500 })\n  }\n}\n\n## Next.js — Data fetching in Server Components\nIn the App Router, data fetching is colocated inside async Server Components using the fetch API. The caching behavior is controlled per request. `fetch(url, { cache: 'force-cache' })` caches until manually invalidated (like getStaticProps) and is the default. `fetch(url, { cache: 'no-store' })` refetches on every request (like getServerSideProps). Time-based revalidation uses `fetch(url, { next: { revalidate: 10 } })` to cache with a 10-second lifetime.\n\nexport default async function Page() {\n  const staticData = await fetch('https://...', { cache: 'force-cache' })\n  const dynamicData = await fetch('https://...', { cache: 'no-store' })\n  const revalidated = await fetch('https://...', { next: { revalidate: 10 } })\n  return \u003cdiv>...\u003c/div>\n}\n\n## Next.js — Dynamic routes with params\nA dynamic segment like [slug] receives a params prop. In recent versions params is a Promise that must be awaited before use. The component fetches the matching record and renders it.\n\nexport default async function BlogPostPage({ params }: { params: Promise\u003c{ slug: string }> }) {\n  const { slug } = await params\n  const post = await getPost(slug)\n  return (\u003cdiv>\u003ch1>{post.title}\u003c/h1>\u003cp>{post.content}\u003c/p>\u003c/div>)\n}\n\n## Vercel AI SDK — Multi-step streamText agent\nA multi-step agent chains streamText calls inside createUIMessageStream. Step 1 can force a tool call (toolChoice: 'required'); step 2 continues the workflow with a different model/system","output":"Энэхүү баримт бичиг нь vLLM-ийн гүйцэтгэлийг нэмэгдүүлэх PagedAttention, tensor parallelism болон chunked prefill-ийн талаарх мэдээллийг агуулсан байна. Мөн Next.js-ийн Server Actions, өгөгдөл татах (data fetching), динамик маршрут болон алдааг шийдвэрлэх route handler-ийн хэрэглээг заасан болно. React-ийн built-in hook-уудыг зори的に ангилдаг бөгөөд Vercel AI SDK-ийг ашиглан олон шатлалт streamText агент бүтээх зааврыг багтаажээ."},{"id":"x22","task":"xsum","question":"Дээрх англи баримт бичгийг Монгол хэлээр 3-4 өгүүлбэрээр товчилж бичээч.","injected":null,"source":"[doc:9cae31b8]\n\n## Next.js — Data fetching in Server Components\nIn the App Router, data fetching is colocated inside async Server Components using the fetch API. The caching behavior is controlled per request. `fetch(url, { cache: 'force-cache' })` caches until manually invalidated (like getStaticProps) and is the default. `fetch(url, { cache: 'no-store' })` refetches on every request (like getServerSideProps). Time-based revalidation uses `fetch(url, { next: { revalidate: 10 } })` to cache with a 10-second lifetime.\n\nexport default async function Page() {\n  const staticData = await fetch('https://...', { cache: 'force-cache' })\n  const dynamicData = await fetch('https://...', { cache: 'no-store' })\n  const revalidated = await fetch('https://...', { next: { revalidate: 10 } })\n  return \u003cdiv>...\u003c/div>\n}\n\n## Next.js — Server Components passing data to Client Components\nA Server Component can fetch data directly with async/await and forward it to a Client Component as props. This replaces getServerSideProps and getStaticProps with a simpler pattern and keeps secrets on the server.\n\nimport HomePage from './home-page'\nasync function getPosts() {\n  const res = await fetch('https://...')\n  return res.json()\n}\nexport default async function Page() {\n  const recentPosts = await getPosts()\n  return \u003cHomePage recentPosts={recentPosts} />\n}\n\n## vLLM — PagedAttention, batching and chunked prefill\nvLLM achieves high serving throughput through PagedAttention, which efficiently manages attention key/value memory, plus continuous batching of incoming requests, chunked prefill, and prefix caching. Chunked prefill improves inter-token latency (ITL) and decode by prioritizing decode requests and batching compute-bound prefill with memory-bound decode. Tuning max_num_batched_tokens trades off TTFT and ITL: smaller values improve ITL, larger values improve TTFT; values above 8192 are recommended for throughput on large GPUs.\n\n## vLLM — Server endpoints overview\nThe server provides multiple OpenAI-compatible endpoints: /v1/completions for raw text generation, /v1/chat/completions for chat with message history and tools, /v1/embeddings for embeddings, and /v1/audio/transcriptions and /v1/audio/translations for speech. It hosts one model at a time and provides a models listing endpoint. The host and port default to localhost:8000 and are configurable with --host and --port.\n\n## React — Built-in hook categories\nReact's built-in Hooks fall into categories. State Hooks: useState (direct updates) and useReducer (update logic in a reducer). Context Hooks: useContext reads and subscribes to a context. Ref Hooks: useRef and useImperativeHandle. Effect Hooks: useEffect connects to external systems, useLayoutEffect fires before paint, useInsertionEffect for libraries injecting CSS. Performance Hooks: useMemo caches expensive results, useCallback caches function definitions, useTransition and useDeferredValue keep the UI responsive. Other Hooks: useId, useSyncExternalStore, useActionState.\n\n## Vercel AI SDK — Multi-step streamText agent\nA multi-step agent chains streamText calls inside createUIMessageStream. Step 1 can force a tool call (toolChoice: 'required'); step 2 continues the workflow with a different model/system prompt and the messages from the previous step. Results are merged into one UI message stream, controlling start/finish events.\n\nconst result1 = streamText({ model: 'openai/gpt-4o-mini', system: 'Extract the user goal.', messages, toolChoice: 'required', tools: { extractGoal: tool({ inputSchema: z.object({ goal: z.string() }), execute: async ({ goal }) => goal }) } });\nwriter.merge(result1.toUIMessageStream({ sendFinish: false }));\nconst result2 = streamText({ model: 'openai/gpt-4o', system: 'Repeat the extracted goal.', messages: [...convertToModelMessages(messages), ...(await result1.response).messages] });\nwriter.merge(result2.toUIMessageStream({ sendStart: false }));\n\n## React — Effects with cleanup\nEffects that connect to an external system","output":"Энэхүү баримт бичиг нь Next.js-ийн сервер компонентуудаар өгөгдөл татах, Vercel AI SDK-ийн агент ашиглах болон vLLM-ийн гүйцэтгэлийг нэмэгдүүлэх аргуудын талаарх зааврыг багтсан байна. Мөн React-ийн hook-уудын ангилал, useReducer болон Context-ийг хослуулан ашиглах, useEffect-ийн цэвэрлэгээний функц зэрэг төлөвлөлтүүдийг тайлбарласан. vLLM-ийн хувьд PagedAttention болон OpenAI-тай нийцэх endpoint-уудын талаарх мэдээллийг өгсөн байна."},{"id":"x23","task":"xsum","question":"Дээрх англи баримт бичгийг Монгол хэлээр 3-4 өгүүлбэрээр товчилж бичээч.","injected":null,"source":"[doc:ab1c02d4]\n\n## Vercel AI SDK — streamText and structured output\nstreamText streams text from a model and prompt; the output is available as a textStream, with a fullStream of typed parts and tool-call handling, retries, and telemetry built in. streamObject is deprecated in favor of streamText with the output setting and Output.object to stream structured data validated by a zod schema.\n\nconst { partialOutputStream } = streamText({ model, output: Output.object({ schema: z.object({ recipe: z.object({ name: z.string(), steps: z.array(z.string()) }) }) }), prompt: 'Generate a lasagna recipe.' });\nfor await (const partial of partialOutputStream) console.log(partial);\n\n## Next.js — Dynamic metadata\ngenerateMetadata lets a route fetch data and set its metadata dynamically — ideal when the title or description depends on route params or an external API.\n\nexport async function generateMetadata({ params }, parent): Promise\u003cMetadata> {\n  const slug = (await params).slug\n  const post = await fetch(`https://api.vercel.app/blog/${slug}`).then(r => r.json())\n  return { title: post.title, description: post.description }\n}\n\n## vLLM — Tensor parallelism\nTensor parallelism shards model parameters across multiple GPUs within each layer, which is essential for models too large to fit on a single GPU. Set tensor_parallel_size to the number of GPUs.\n\nfrom vllm import LLM\nllm = LLM(model=\"meta-llama/Llama-3.3-70B-Instruct\", tensor_parallel_size=4)\n\n## React — useReducer with Context\nFor complex state, a parent manages it with useReducer while Context passes both state and dispatch deep into the tree, so any descendant can read state and dispatch actions without prop drilling.\n\nconst [tasks, dispatch] = useReducer(tasksReducer, initialTasks);\nfunction tasksReducer(tasks, action) {\n  switch (action.type) {\n    case 'added': return [...tasks, { id: action.id, text: action.text, done: false }];\n    case 'changed': return tasks.map(t => t.id === action.task.id ? action.task : t);\n    case 'deleted': return tasks.filter(t => t.id !== action.id);\n    default: throw Error('Unknown action: ' + action.type);\n  }\n}\n\n## Next.js — Dynamic routes with params\nA dynamic segment like [slug] receives a params prop. In recent versions params is a Promise that must be awaited before use. The component fetches the matching record and renders it.\n\nexport default async function BlogPostPage({ params }: { params: Promise\u003c{ slug: string }> }) {\n  const { slug } = await params\n  const post = await getPost(slug)\n  return (\u003cdiv>\u003ch1>{post.title}\u003c/h1>\u003cp>{post.content}\u003c/p>\u003c/div>)\n}\n\n## Next.js — Route handler with error handling\nA POST route handler should wrap work in try/catch, return appropriate HTTP status codes, and avoid leaking sensitive error detail to clients.\n\nimport { submit } from '@/lib/submit'\nexport async function POST(request: Request) {\n  try {\n    await submit(request)\n    return new Response(null, { status: 204 })\n  } catch (reason) {\n    const message = reason instanceof Error ? reason.message : 'Unexpected error'\n    return new Response(message, { status: 500 })\n  }\n}\n\n## React — Built-in hook categories\nReact's built-in Hooks fall into categories. State Hooks: useState (direct updates) and useReducer (update logic in a reducer). Context Hooks: useContext reads and subscribes to a context. Ref Hooks: useRef and useImperativeHandle. Effect Hooks: useEffect connects to external systems, useLayoutEffect fires before paint, useInsertionEffect for libraries injecting CSS. Performance Hooks: useMemo caches expensive results, useCallback caches function definitions, useTransition and useDeferredValue keep the UI responsive. Other Hooks: useId, useSyncExternalStore, useActionState.\n\n## Vercel AI SDK — Multi-step streamText agent\nA multi-step agent chains streamText calls inside createUIMessageStream. Step 1 can force a tool call (toolChoice: 'required'); step 2 continues the workflow with a different model/system prompt and the messages from the previous step. Res","output":"Энэхүү баримт бичиг нь Vercel AI SDK-ийн `streamText` болон бүтцийн өгөгдөл урсгалах, Next.js-ийн динамик мета өгөгдөл, маршрут болон алдаа шийдвэрлэх аргуудын талаар зааварчилгаа өгсөн байна. Мөн vLLM-ийн тензор параллелизм болон React-ийн `useReducer`, Context, түүнчлэн Hook-уудын ангиллын талаарх техникийн мэдээллийг багтаасан болно. Түүнчлэн, Vercel AI SDK-ийг ашиглан олон шатлалт агент үүсгэх аргачлалыг тайлбарлажээ."},{"id":"x24","task":"xsum","question":"Дээрх англи баримт бичгийг Монгол хэлээр 3-4 өгүүлбэрээр товчилж бичээч.","injected":null,"source":"[doc:2af9c9a1]\n\n## Next.js — Server Components passing data to Client Components\nA Server Component can fetch data directly with async/await and forward it to a Client Component as props. This replaces getServerSideProps and getStaticProps with a simpler pattern and keeps secrets on the server.\n\nimport HomePage from './home-page'\nasync function getPosts() {\n  const res = await fetch('https://...')\n  return res.json()\n}\nexport default async function Page() {\n  const recentPosts = await getPosts()\n  return \u003cHomePage recentPosts={recentPosts} />\n}\n\n## Vercel AI SDK — Multi-step streamText agent\nA multi-step agent chains streamText calls inside createUIMessageStream. Step 1 can force a tool call (toolChoice: 'required'); step 2 continues the workflow with a different model/system prompt and the messages from the previous step. Results are merged into one UI message stream, controlling start/finish events.\n\nconst result1 = streamText({ model: 'openai/gpt-4o-mini', system: 'Extract the user goal.', messages, toolChoice: 'required', tools: { extractGoal: tool({ inputSchema: z.object({ goal: z.string() }), execute: async ({ goal }) => goal }) } });\nwriter.merge(result1.toUIMessageStream({ sendFinish: false }));\nconst result2 = streamText({ model: 'openai/gpt-4o', system: 'Repeat the extracted goal.', messages: [...convertToModelMessages(messages), ...(await result1.response).messages] });\nwriter.merge(result2.toUIMessageStream({ sendStart: false }));\n\n## Next.js — Server Actions for mutations\nMutations should be handled by Server Actions, invoked from a \u003cform> so they only run on explicit user interaction (never as a side effect of rendering). This keeps mutation logic on the server and avoids accidental writes during render.\n\nimport { logout } from './actions'\nexport default function Page() {\n  return (\u003c>\u003cUserProfile />\u003cform action={logout}>\u003cbutton type=\"submit\">Logout\u003c/button>\u003c/form>\u003c/>)\n}\n\n## Next.js — Data fetching in Server Components\nIn the App Router, data fetching is colocated inside async Server Components using the fetch API. The caching behavior is controlled per request. `fetch(url, { cache: 'force-cache' })` caches until manually invalidated (like getStaticProps) and is the default. `fetch(url, { cache: 'no-store' })` refetches on every request (like getServerSideProps). Time-based revalidation uses `fetch(url, { next: { revalidate: 10 } })` to cache with a 10-second lifetime.\n\nexport default async function Page() {\n  const staticData = await fetch('https://...', { cache: 'force-cache' })\n  const dynamicData = await fetch('https://...', { cache: 'no-store' })\n  const revalidated = await fetch('https://...', { next: { revalidate: 10 } })\n  return \u003cdiv>...\u003c/div>\n}\n\n## vLLM — Server endpoints overview\nThe server provides multiple OpenAI-compatible endpoints: /v1/completions for raw text generation, /v1/chat/completions for chat with message history and tools, /v1/embeddings for embeddings, and /v1/audio/transcriptions and /v1/audio/translations for speech. It hosts one model at a time and provides a models listing endpoint. The host and port default to localhost:8000 and are configurable with --host and --port.\n\n## React — Built-in hook categories\nReact's built-in Hooks fall into categories. State Hooks: useState (direct updates) and useReducer (update logic in a reducer). Context Hooks: useContext reads and subscribes to a context. Ref Hooks: useRef and useImperativeHandle. Effect Hooks: useEffect connects to external systems, useLayoutEffect fires before paint, useInsertionEffect for libraries injecting CSS. Performance Hooks: useMemo caches expensive results, useCallback caches function definitions, useTransition and useDeferredValue keep the UI responsive. Other Hooks: useId, useSyncExternalStore, useActionState.\n\n## React — useReducer with Context\nFor complex state, a parent manages it with useReducer while Context passes both state and dispatch deep into the tree, so any descendant can read state and dispatch actions w","output":"Энэхүү баримт бичигт Next.js-ийн сервер компонентууд, өгөгдөл татах (fetch), сервер-акшн болон динамик маршрутын талаарх зааварчилгааг багтаасан байна. Мөн React-ийн төрөл бүрийн хук-ууд (Hooks) болон `useReducer`-ийг Context-тэй хамт ашиглах арга замыг тайлбарласан. Үүнээс гадна Vercel AI SDK-ийн олон шатлалт агент болон vLLM-ийн OpenAI-тай нийцэлтэй сервер эндпоинтуудын талаарх мэдээллийг өгсөн байна."},{"id":"x25","task":"xsum","question":"Дээрх англи баримт бичгийг Монгол хэлээр 3-4 өгүүлбэрээр товчилж бичээч.","injected":null,"source":"[doc:459f3b28]\n\n## vLLM — Tensor parallelism\nTensor parallelism shards model parameters across multiple GPUs within each layer, which is essential for models too large to fit on a single GPU. Set tensor_parallel_size to the number of GPUs.\n\nfrom vllm import LLM\nllm = LLM(model=\"meta-llama/Llama-3.3-70B-Instruct\", tensor_parallel_size=4)\n\n## Next.js — Data fetching in Server Components\nIn the App Router, data fetching is colocated inside async Server Components using the fetch API. The caching behavior is controlled per request. `fetch(url, { cache: 'force-cache' })` caches until manually invalidated (like getStaticProps) and is the default. `fetch(url, { cache: 'no-store' })` refetches on every request (like getServerSideProps). Time-based revalidation uses `fetch(url, { next: { revalidate: 10 } })` to cache with a 10-second lifetime.\n\nexport default async function Page() {\n  const staticData = await fetch('https://...', { cache: 'force-cache' })\n  const dynamicData = await fetch('https://...', { cache: 'no-store' })\n  const revalidated = await fetch('https://...', { next: { revalidate: 10 } })\n  return \u003cdiv>...\u003c/div>\n}\n\n## vLLM — Conserving memory\nMemory usage can be reduced by limiting context length with max_model_len and the maximum batch size with max_num_seqs. This is useful under memory constraints or when sequences are short.\n\nfrom vllm import LLM\nllm = LLM(model=\"adept/fuyu-8b\", max_model_len=2048, max_num_seqs=2)\n\n## vLLM — OpenAI-compatible Chat API\nvLLM exposes an HTTP server implementing the OpenAI API protocol, acting as a drop-in replacement. POST /v1/chat/completions accepts messages (the conversation history), plus optional model, stream, max_tokens, temperature, top_p, and stop. The response contains choices and a usage object with prompt_tokens, completion_tokens, and total_tokens. parallel_tool_calls controls whether more than one tool call is allowed per request (default true).\n\n## Next.js — Dynamic metadata\ngenerateMetadata lets a route fetch data and set its metadata dynamically — ideal when the title or description depends on route params or an external API.\n\nexport async function generateMetadata({ params }, parent): Promise\u003cMetadata> {\n  const slug = (await params).slug\n  const post = await fetch(`https://api.vercel.app/blog/${slug}`).then(r => r.json())\n  return { title: post.title, description: post.description }\n}\n\n## React — Effects with cleanup\nEffects that connect to an external system should return a cleanup function. A chat connection must disconnect on cleanup so connections do not accumulate. For data fetching, an \"ignore\" flag prevents a stale response from overwriting fresh state.\n\nuseEffect(() => {\n  let ignore = false;\n  async function start() { const json = await fetchTodos(userId); if (!ignore) setTodos(json); }\n  start();\n  return () => { ignore = true; };\n}, [userId]);\n\n## Vercel AI SDK — useChat on the client\nThe useChat hook from @ai-sdk/react manages chat state on the client. It exposes messages and sendMessage; each message has parts that can be text or tool-call parts, which the UI renders accordingly.\n\nconst { messages, sendMessage } = useChat();\nmessages.map(m => m.parts.map((part, i) => part.type === 'text' ? \u003cspan key={i}>{part.text}\u003c/span> : \u003cpre key={i}>{JSON.stringify(part, null, 2)}\u003c/pre>));\n\n## Next.js — Route handler with error handling\nA POST route handler should wrap work in try/catch, return appropriate HTTP status codes, and avoid leaking sensitive error detail to clients.\n\nimport { submit } from '@/lib/submit'\nexport async function POST(request: Request) {\n  try {\n    await submit(request)\n    return new Response(null, { status: 204 })\n  } catch (reason) {\n    const message = reason instanceof Error ? reason.message : 'Unexpected error'\n    return new Response(message, { status: 500 })\n  }\n}\n\n## Vercel AI SDK — Multi-step streamText agent\nA multi-step agent chains streamText calls inside createUIMessageStream. Step 1 can force a tool call (toolChoice: 'required');","output":"Энэхүү баримт бичиг нь vLLM-ийн GPU-г оновчтой ашиглах, OpenAI-тай нийцэх API-г хэрэглэх заавар болон Next.js-ийн өгөгдөл татах, мета өгөгдөл үүсгэх, алдааг шийдвэрлэх аргуудыг тайлбарласан байна. Мөн React-ийн useEffect-ийг цэвэрлэх функцтэйгээр ашиглах болон Vercel AI SDK-ийн `useChat` hook болон олон шатлалт `streamText` агентыг хэрхэн хэрэгжүүлэх талаар зааварчилгаа өгсөн байна. Ерөнхийдөө энэ нь vLLM, Next.js болон Vercel AI SDK-ийг ашиглан AI чат систем хөгжүүлэх техникийн заавар юм."},{"id":"x26","task":"xsum","question":"Дээрх англи баримт бичгийг Монгол хэлээр 3-4 өгүүлбэрээр товчилж бичээч.","injected":null,"source":"[doc:5180a57d]\n\n## Next.js — Dynamic routes with params\nA dynamic segment like [slug] receives a params prop. In recent versions params is a Promise that must be awaited before use. The component fetches the matching record and renders it.\n\nexport default async function BlogPostPage({ params }: { params: Promise\u003c{ slug: string }> }) {\n  const { slug } = await params\n  const post = await getPost(slug)\n  return (\u003cdiv>\u003ch1>{post.title}\u003c/h1>\u003cp>{post.content}\u003c/p>\u003c/div>)\n}\n\n## Next.js — Streaming with Suspense\nReact's Suspense component enables streaming server rendering and selective hydration. Wrap components that perform async work and provide a fallback UI; the page streams in as each boundary resolves, improving perceived performance.\n\nimport { Suspense } from 'react'\nimport { PostFeed, Weather } from './Components iate HTTP status codes, and avoid leaking sensitive error detail to clients.\n\nimport { submit } from '@/lib/submit'\nexport async function POST(request: Request) {\n  try {\n    await submit(request)\n    return new Response(null, { status: 204 })\n  } catch (reason) {\n    const message = reason instanceof Error ? reason.message : 'Unexpected error'\n    return new Response(message, { status: 500 })\n  }\n}\n\n## Next.js — Server Components passing data to Client Components\nA Server Component can fetch data directly with async/await and forward it to a Client Component as props. This replaces getServerSideProps and getStaticProps with a simpler pattern and keeps secrets on the server.\n\nimport HomePage from './home-page'\nasync function getPosts() {\n  const res = await fetch('https://...')\n  return res.json()\n}\nexport default async function Page() {\n  const recentPosts = await getPosts()\n  return \u003cHomePage recentPosts={recentPosts} />\n}\n\n## Vercel AI SDK — Multi-step streamText agent\nA multi-step agent chains streamText calls inside createUIMessageStream. Step 1 can force a tool call (toolChoice: 'required'); step 2 continues the workflow with a different model/system prompt and the messages from the previous step. Results are merged into one UI message stream, controlling start/finish events.\n\nconst result1 = streamText({ model: 'openai/gpt-4o-mini', system: 'Extract the user goal.', messages, toolChoice: 'required', tools: { extractGoal: tool({ inputSchema: z.object({ goal: z.string() }), execute: async ({ goal }) => goal }) } });\nwriter.merge(result1.toUIMessageStream({ sendFinish: false }));\nconst result2 = streamText({ model: 'openai/gpt-4o', system: 'Repeat the extracted goal.', messages: [...convertToModelMessages(messages), ...(await result1.response).messages] });\nwriter.merge(result2.toUIMessageStream({ sendStart: false }));\n\n## vLLM — OpenAI-compatible Chat API\nvLLM exposes an HTTP server implementing the OpenAI API protocol, acting as a drop-in replacement. POST /","output":"Энэхүү баримт бичиг нь Next.js болон React-ийн гүйцэтгэлийг сайжруулах Suspense, Hook-ийн төрлүүд, мөн сервер болон клиент компонентуудын дата дамжуулах аргуудын талаарх зааврыг багтаасан байна. Мөн Vercel AI SDK-ийн `streamText`-ийг ашиглан бүтэцлэгдсэн өгөгдөл болон олон шатлалт агент үүсгэх, vLLM-ийг OpenAI-ийн API-тай нийцүүлэн ашиглах зааврыг тусгажээ. Үүнд алдааг шийдвэрлэх Route handler болон төвлөрсөн төлөвийг удирдах `useReducer`-ийг Context-тэй хамт ашиглах жишээнүүдийг багтаасан байна."},{"id":"x28","task":"xsum","question":"Дээрх англи баримт бичгийг Монгол хэлээр 3-4 өгүүлбэрээр товчилж бичээч.","injected":null,"source":"[doc:4fe29045]\n\n## Next.js — Server Components passing data to Client Components\nA Server Component can fetch data directly with async/await and forward it to a Client Component as props. This replaces getServerSideProps and getStaticProps with a simpler pattern and keeps secrets on the server.\n\nimport HomePage from './home-page'\nasync function getPosts() {\n  const res = await fetch('https://...')\n  return res.json()\n}\nexport default async function Page() {\n  const recentPosts = await getPosts()\n  return \u003cHomePage recentPosts={recentPosts} />\n}\n\n## Next.js — Server Actions for mutations\nMutations should be handled by Server Actions, invoked from a \u003cform> so they only run on explicit user interaction (never as a side effect of rendering). This keeps mutation logic on the server and avoids accidental writes during render.\n\nimport { logout } from './actions'\nexport default function Page() {\n  return (\u003c>\u003cUserProfile />\u003cform action={logout}>\u003cbutton type=\"submit\">Logout\u003c/button>\u003c/form>\u003c/>)\n}\n\n## Vercel AI SDK — useChat on the client\nThe useChat hook from @ai-sdk/react manages chat state on the client. It exposes messages and sendMessage; each message has parts that can be text or tool-call parts, which the UI renders accordingly.\n\nconst { messages, sendMessage } = useChat();\nmessages.map(m => m.parts.map((part, i) => part.type === 'text' ? \u003cspan key={i}>{part.text}\u003c/span> : \u003cpre key={i}>{JSON.stringify(part, null, 2)}\u003c/pre>));\n\n## React — useReducer with Context\nFor complex state, a parent manages it with useReducer while Context passes both state and dispatch deep into the tree, so any descendant can read state and dispatch actions without prop drilling.\n\nconst [tasks, dispatch] = useReducer(tasksReducer, initialTasks);\nfunction tasksReducer(tasks, action) {\n  switch (action.type) {\n    case 'added': return [...tasks, { id: action.id, text: action.text, done: false }];\n    case 'changed': return tasks.map(t => t.id === action.task.id ? action.task : t);\n    case 'deleted': return tasks.filter(t => t.id !== action.id);\n    default: throw Error('Unknown action: ' + action.type);\n  }\n}\n\n## vLLM — PagedAttention, batching and chunked prefill\nvLLM achieves high serving throughput through PagedAttention, which efficiently manages attention key/value memory, plus continuous batching of incoming requests, chunked prefill, and prefix caching. Chunked prefill improves inter-token latency (ITL) and decode by prioritizing decode requests and batching compute-bound prefill with memory-bound decode. Tuning max_num_batched_tokens trades off TTFT and ITL: smaller values improve ITL, larger values improve TTFT; values above 8192 are recommended for throughput on large GPUs.\n\n## Next.js — Data fetching in Server Components\nIn the App Router, data fetching is colocated inside async Server Components using the fetch API. The caching behavior is controlled per request. `fetch(url, { cache: 'force-cache' })` caches until manually invalidated (like getStaticProps) and is the default. `fetch(url, { cache: 'no-store' })` refetches on every request (like getServerSideProps). Time-based revalidation uses `fetch(url, { next: { revalidate: 10 } })` to cache with a 10-second lifetime.\n\nexport default async function Page() {\n  const staticData = await fetch('https://...', { cache: 'force-cache' })\n  const dynamicData = await fetch('https://...', { cache: 'no-store' })\n  const revalidated = await fetch('https://...', { next: { revalidate: 10 } })\n  return \u003cdiv>...\u003c/div>\n}\n\n## React — Effects with cleanup\nEffects that connect to an external system should return a cleanup function. A chat connection must disconnect on cleanup so connections do not accumulate. For data fetching, an \"ignore\" flag prevents a stale response from overwriting fresh state.\n\nuseEffect(() => {\n  let ignore = false;\n  async function start() { const json = await fetchTodos(userId); if (!ignore) setTodos(json); }\n  start();\n  return () => { ignore = true; };\n}, [userId]);\n\n## vLLM — Tensor par","output":"Энэхүү баримт бичиг нь Next.js-ийн сервер компонент, сервер экшн болон өгөгдөл татах аргууд, Vercel AI SDK-ийн чат болон текст урсгалын удирдлага, React-ийн төлөв удирдлага (useReducer, Context) болон useEffect-ийн цэвэрлэгээний талаарх зааврыг багтаасан болно. Мөн vLLM-ийн PagedAttention, багцалсан боловсруулалт (batching), тензор параллелизм зэрэг өндөр гүйцэтгэлтэй үйлчилгээ үзүүлэх аргуудыг тайлбарласан байна. Ерөнхийдөө программ хангамжийн архитектур, хиймэл оюун ухааны загварын үйлчилгээ болон фронт-энд хөгжүүлэлтийн дэвшилтэт техникүүдийг харуулж байна."},{"id":"x29","task":"xsum","question":"Дээрх англи баримт бичгийг Монгол хэлээр 3-4 өгүүлбэрээр товчилж бичээч.","injected":null,"source":"[doc:9cf3d529]\n\n## vLLM — Tensor parallelism\nTensor parallelism shards model parameters across multiple GPUs within each layer, which is essential for models too large to fit on a single GPU. Set tensor_parallel_size to the number of GPUs.\n\nfrom vllm import LLM\nllm = LLM(model=\"meta-llama/Llama-3.3-70B-Instruct\", tensor_parallel_size=4)\n\n## Next.js — Server Actions for mutations\nMutations should be handled by Server Actions, invoked from a \u003cform> so they only run on explicit user interaction (never as a side effect of rendering). This keeps mutation logic on the server and avoids accidental writes during render.\n\nimport { logout } from './actions'\nexport default function Page() {\n  return (\u003c>\u003cUserProfile />\u003cform action={logout}>\u003cbutton type=\"submit\">Logout\u003c/button>\u003c/form>\u003c/>)\n}\n\n## Next.js — Dynamic metadata\ngenerateMetadata lets a route fetch data and set its metadata dynamically — ideal when the title or description depends on route params or an external API.\n\nexport async function generateMetadata({ params }, parent): Promise\u003cMetadata> {\n  const slug = (await params).slug\n  const post = await fetch(`https://api.vercel.app/blog/${slug}`).then(r => r.json())\n  return { title: post.title, description: post.description }\n}\n\n## vLLM — OpenAI-compatible Chat API\nvLLM exposes an HTTP server implementing the OpenAI API protocol, acting as a drop-in replacement. POST /v1/chat/completions accepts messages (the conversation history), plus optional model, stream, max_tokens, temperature, top_p, and stop. The response contains choices and a usage object with prompt_tokens, completion_tokens, and total_tokens. parallel_tool_calls controls whether more than one tool call is allowed per request (default true).\n\n## Next.js — Route handler with error handling\nA POST route handler should wrap work in try/catch, return appropriate HTTP status codes, and avoid leaking sensitive error detail to clients.\n\nimport { submit } from '@/lib/submit'\nexport async function POST(request: Request) {\n  try {\n    await submit(request)\n    return new Response(null, { status: 204 })\n  } catch (reason) {\n    const message = reason instanceof Error ? reason.message : 'Unexpected error'\n    return new Response(message, { status: 500 })\n  }\n}\n\n## Vercel AI SDK — useChat on the client\nThe useChat hook from @ai-sdk/react manages chat state on the client. It exposes messages and sendMessage; each message has parts that can be text or tool-call parts, which the UI renders accordingly.\n\nconst { messages, sendMessage } = useChat();\nmessages.map(m => m.parts.map((part, i) => part.type === 'text' ? \u003cspan key={i}>{part.text}\u003c/span> : \u003cpre key={i}>{JSON.stringify(part, null, 2)}\u003c/pre>));\n\n## Next.js — Dynamic routes with params\nA dynamic segment like [slug] receives a params prop. In recent versions params is a Promise that must be awaited before use. The component fetches the matching record and renders it.\n\nexport default async function BlogPostPage({ params }: { params: Promise\u003c{ slug: string }> }) {\n  const { slug } = await params\n  const post = await getPost(slug)\n  return (\u003cdiv>\u003ch1>{post.title}\u003c/h1>\u003cp>{post.content}\u003c/p>\u003c/div>)\n}\n\n## React — Effects with cleanup\nEffects that connect to an external system should return a cleanup function. A chat connection must disconnect on cleanup so connections do not accumulate. For data fetching, an \"ignore\" flag prevents a stale response from overwriting fresh state.\n\nuseEffect(() => {\n  let ignore = false;\n  async function start() { const json = await fetchTodos(userId); if (!ignore) setTodos(json); }\n  start();\n  return () => { ignore = true; };\n}, [userId]);\n\n## React — Built-in hook categories\nReact's built-in Hooks fall into categories. State Hooks: useState (direct updates) and useReducer (update logic in a reducer). Context Hooks: useContext reads and subscribes to a context. Ref Hooks: useRef and useImperativeHandle. Effect Hooks: useEffect connects to external systems, useLayoutEffect fires before paint, useInsertionEffect","output":"Энэхүү баримт бичиг нь vLLM-ийн тензор параллелизм болон OpenAI-тай нийцэлтэй API-ийн талаарх заавар, Next.js-ийн сервер action, динамик мета өгөгдөл, route handler болон динамик route-ийн хэрэглээг тайлбарласан байна. Мөн Vercel AI SDK-ийн `useChat` hook болон React-ийн төрөл бүрийн hook-ууд (State, Context, Ref, Effect, Performance), тэр дундаа `useReducer`-ийг Context-тэй хамт ашиглах арга, effect-ийн цэвэрлэгээний функцийг багтаасан болно. Ерөнхийдөө энэ нь орчин үеийн веб хөгжүүлэлт болон хиймэл оюун ухааны загварыг ашиглах техникийн зааварчилгаа юм."},{"id":"x30","task":"xsum","question":"Дээрх англи баримт бичгийг Монгол хэлээр 3-4 өгүүлбэрээр товчилж бичээч.","injected":null,"source":"[doc:5778ce36]\n\n## Next.js — Server Components passing data to Client Components\nA Server Component can fetch data directly with async/await and forward it to a Client Component as props. This replaces getServerSideProps and getStaticProps with a simpler pattern and keeps secrets on the server.\n\nimport HomePage from './home-page'\nasync function getPosts() {\n  const res = await fetch('https://...')\n  return res.json()\n}\nexport default async function Page() {\n  const recentPosts = await getPosts()\n  return \u003cHomePage recentPosts={recentPosts} />\n}\n\n## Vercel AI SDK — Multi-step streamText agent\nA multi-step agent chains streamText calls inside createUIMessageStream. Step 1 can force a tool call (toolChoice: 'required'); step 2 continues the workflow with a different model/system prompt and the messages from the previous step. Results are merged into one UI message stream, controlling start/finish events.\n\nconst result1 = streamText({ model: 'openai/gpt-4o-mini', system: 'Extract the user goal.', messages, toolChoice: 'required', tools: { extractGoal: tool({ inputSchema: z.object({ goal: z.string() }), execute: async ({ goal }) => goal }) } });\nwriter.merge(result1.toUIMessageStream({ sendFinish: false }));\nconst result2 = streamText({ model: 'openai/gpt-4o', system: 'Repeat the extracted goal.', messages: [...convertToModelMessages(messages), ...(await result1.response).messages] });\nwriter.merge(result2.toUIMessageStream({ sendStart: false }));\n\n## Next.js — Dynamic routes with params\nA dynamic segment like [slug] receives a params prop. In recent versions params is a Promise that must be awaited before use. The component fetches the matching record and renders it.\n\nexport default async function BlogPostPage({ params }: { params: Promise\u003c{ slug: string }> }) {\n  const { slug } = await params\n  const post = await getPost(slug)\n  return (\u003cdiv>\u003ch1>{post.title}\u003c/h1>\u003cp>{post.content}\u003c/p>\u003c/div>)\n}\n\n## Next.js — Data fetching in Server Components\nIn the App Router, data fetching is colocated inside async Server Components using the fetch API. The caching behavior is controlled per request. `fetch(url, { cache: 'force-cache' })` caches until manually invalidated (like getStaticProps) and is the default. `fetch(url, { cache: 'no-store' })` refetches on every request (like getServerSideProps). Time-based revalidation uses `fetch(url, { next: { revalidate: 10 } })` to cache with a 10-second lifetime.\n\nexport default async function Page() {\n  const staticData = await fetch('https://...', { cache: 'force-cache' })\n  const dynamicData = await fetch('https://...', { cache: 'no-store' })\n  const revalidated = await fetch('https://...', { next: { revalidate: 10 } })\n  return \u003cdiv>...\u003c/div>\n}\n\n## vLLM — OpenAI-compatible Chat API\nvLLM exposes an HTTP server implementing the OpenAI API protocol, acting as a drop-in replacement. POST /v1/chat/completions accepts messages (the conversation history), plus optional model, stream, max_tokens, temperature, top_p, and stop. The response contains choices and a usage object with prompt_tokens, completion_tokens, and total_tokens. parallel_tool_calls controls whether more than one tool call is allowed per request (default true).\n\n## vLLM — Tensor parallelism\nTensor parallelism shards model parameters across multiple GPUs within each layer, which is essential for models too large to fit on a single GPU. Set tensor_parallel_size to the number of GPUs.\n\nfrom vllm import LLM\nllm x_model_len and the maximum batch size with max_num_seqs. This is useful under memory constraints or when sequences are short.\n\nfrom vllm import LLM\nllm = LLM(model=\"adept/fuyu-8b\", max_model_len=2048, max_num_seqs=2)\n\n## React — Built-in hook categories\nReact's built-in Hooks fall into categories. State Hooks: useState (direct updates) and useReducer (update logic in a reducer). Context Hooks: useContext reads and subscribes to a context. Ref Hooks: useRef and useImperativeHandle. Effect Hooks: useEffect connects to external systems, useLayoutEffect fires before paint, useInsertionEffect for libraries injecting CSS. Performance H","output":"Энэхүү баримт бичигт Next.js-ийн динамик зам, өгөгдөл татах, сервер үйлдлүүд болон алдаа зохицуулах аргуудын талаарх зааврыг тусгасан байна. React-ийн төрөл бүрийн Hook-ууд болон useEffect-ийн цэвэрлэгээний функцийг ашиглах талаарх мэдээллийг багцалсан байна. Мөн vLLM-ийн санах ойг хэмнэх арга болон Vercel AI SDK-ийн streamText-ийг ашиглан бүтэцлэгдсэн өгөгдөл урсгал-давраа гаргах зааврыг өгүүлжээ.","score":2,"pass":false,"fluent":false}]},"model":"gemma-4-31b","modelRoot":"RedHatAI/gemma-4-31B-it-NVFP4","server":"vllm-0.21.0-81cc15f0","maxModelLen":16384,"kvCapacityTokens":59856};

      '<div class="note">Aggregate output tok/s. Bigger inputs are prefill-bound and saturate sooner.</div>',true));
  window.__after.push(()=>{
    lineChart(pThru,concs,sizes.map((s,i)=>({label:s+' tok',data:concs.map(cc=>get(s,cc,c=>c.aggOutputTps)),borderColor:palette[i%4],backgroundColor:palette[i%4]})),'output tok/s');
    lineChart(pTtft,concs,sizes.map((s,i)=>({label:s+' tok',data:concs.map(cc=>get(s,cc,c=>c.ttft?.p95)),borderColor:palette[i%4],backgroundColor:palette[i%4]})),'TTFT p95 (ms)');
  });
}
if(LC){
  const c=LC.cells, labels=c.map(x=>x.concurrency); const ds=LC.meta.docSizes||[];
  section('Long-context & summarization (real Context7 docs)',
    chartPanel('Output throughput & req/s vs concurrency','lThru')+
    chartPanel('KV utilization vs concurrency','lKv')+
    chartPanel('E2E p50 by document size','lDoc')+
    panel('Numbers',
      tableEl(['c','in tok','out tok','E2E p50 (s)','E2E p95 (s)','tok/s','req/s','Peak KV%','Wait'],
        c.map(x=>[x.concurrency,f(x.meanPromptTokens,0),f(x.meanOutputTokens,0),f(x.e2e.p50/1000,2),f(x.e2e.p95/1000,2),f(x.aggOutputTps,0),f(x.achievedReqPerSec,2),f(x.peakKvUsagePct,0)+'%',f(x.peakWaiting,0)]))));
  window.__after.push(()=>{
    lineChart(lThru,labels,[
      {label:'output tok/s',data:c.map(x=>x.aggOutputTps),borderColor:C.b,backgroundColor:C.b,yAxisID:'y'},
      {label:'req/s',data:c.map(x=>x.achievedReqPerSec),borderColor:C.a,backgroundColor:C.a,yAxisID:'y1'}],'tok/s','req/s');
    lineChart(lKv,labels,[{label:'peak KV %',data:c.map(x=>x.peakKvUsagePct),borderColor:C.e,backgroundColor:'rgba(169,139,255,.15)',fill:true},
      {label:'peak waiting',data:c.map(x=>x.peakWaiting),borderColor:C.d,backgroundColor:C.d,yAxisID:'y'}],'% / count');
    barChart(lDoc,labels,ds.map((s,i)=>({label:s+' tok',data:c.map(x=>(x.byBucket?.[s]?.e2eP50??null)/1000),backgroundColor:[C.a,C.b,C.c,C.d][i%4]})),'E2E p50 (s)');
  });
}
if(TH){
  const concs=[...new Set(TH.cells.map(x=>x.concurrency))].sort((a,b)=>a-b);
  const on=concs.map(cc=>TH.cells.find(x=>x.mode==='think'&&x.concurrency===cc));
  const off=concs.map(cc=>TH.cells.find(x=>x.mode==='nothink'&&x.concurrency===cc));
  section('Sustained decode / reasoning ('+(TH.meta.outputTokens)+'-token forced output, thinking ON vs OFF)',
    chartPanel('Per-stream decode tok/s (ON vs OFF)','tDec')+
    chartPanel('Aggregate output tok/s (ON vs OFF)','tAgg')+
    panel('Numbers',
      tableEl(['c','mode','decode tok/s','agg tok/s','TTFT p50 (ms)','E2E p50 (s)','reason%'],
        TH.cells.sort((a,b)=>a.concurrency-b.concurrency||(a.mode<b.mode?-1:1)).map(x=>[x.concurrency,x.mode==='think'?'thinking':'plain',f(x.decodeTpsPerReq,1),f(x.aggOutputTps,1),f(x.ttft.p50,0),f(x.e2e.p50/1000,2),f((x.meanReasoningFrac||0)*100,0)+'%'])),true));
  window.__after.push(()=>{
    barChart(tDec,concs,[
      {label:'thinking ON',data:on.map(x=>x?.decodeTpsPerReq),backgroundColor:C.e},
      {label:'thinking OFF',data:off.map(x=>x?.decodeTpsPerReq),backgroundColor:C.b}],'tok/s/stream');
    barChart(tAgg,concs,[
      {label:'thinking ON',data:on.map(x=>x?.aggOutputTps),backgroundColor:C.e},
      {label:'thinking OFF',data:off.map(x=>x?.aggOutputTps),backgroundColor:C.b}],'tok/s');
  });
}
if(Q){
  const lab={weather:'Weather (tool)',offtopic:'Off-topic chat',summarize:'Summarization',longctx:'Long-context reasoning'};
  const tasks=Object.keys(Q.summary);
  section('Output quality — LLM-as-judge + adversarial verification',
    chartPanel('Pass rate by task (%)','qPass')+
    chartPanel('Mean quality score by task (1–5)','qScore')+
    panel('Per-task grades',
      tableEl(['Task','Samples','Passed','Pass %','Mean score'],
        tasks.map(t=>[esc(lab[t]||t),Q.summary[t].n,Q.summary[t].pass,f(Q.summary[t].passPct,0)+'%',f(Q.summary[t].meanScore,1)+'/5']))+
      '<div class="note">'+esc(Q.meta?.method||'')+'. N='+f(Q.overall.total,0)+' real-prompt samples; '+((Q.fails&&Q.fails.length)?Q.fails.length+' hallucinations/failures flagged':'0 hallucinations/failures flagged')+' by either the grader or the adversarial verifier.</div>', true));
  window.__after.push(()=>{
    barChart(qPass,tasks.map(t=>lab[t]||t),[{label:'pass %',data:tasks.map(t=>Q.summary[t].passPct),backgroundColor:C.b}],'%');
    barChart(qScore,tasks.map(t=>lab[t]||t),[{label:'mean score',data:tasks.map(t=>Q.summary[t].meanScore),backgroundColor:C.a}],'score (1–5)');
  });
}
if(MN){
  const c=MN.cells;
  let inner = panel('Load — Mongolian prompts (weather / general / EN→MN summary)',
    tableEl(['c','req/s','TTFT p50 (ms)','E2E p50 (s)','E2E p95 (s)','Tool-call%','Mean in tok','Mean out tok','Peak KV%'],
      c.map(x=>[x.concurrency,f(x.achievedReqPerSec,2),f(x.ttft.p50,0),f(x.e2e.p50/1000,2),f(x.e2e.p95/1000,2),f(x.weatherToolRatePct,0)+'%',f(x.meanPromptTokens,0),f(x.meanOutputTokens,0),f(x.peakKvUsagePct,0)+'%']))+
    '<div class="note">⚠ Mongolian costs ~'+f(MN.meta.tokenOverhead,1)+'× the tokens of equivalent English — fewer characters per token, so higher latency/cost per request and less of the '+(MN.meta.maxModelLen||8192)+'-token window available.</div>', true);
  if(mnBest){
    const lab={weather:'Weather',general:'General',xsum:'EN→MN sum'};
    const tasks=Object.keys(mnBest.summary);
    if(MNV.length>1) inner += chartPanel('Prompt A/B — Mongolian pass% by task across prompt variants','mnAB');
    else inner += chartPanel('Mongolian output quality — pass% & fluency% by task','mnAB');
    inner += panel('Mongolian output quality by prompt variant (same 30 prompts)',
      tableEl(['Task',...MNV.map(v=>v.label)],
        tasks.map(t=>[esc(lab[t]||t),...MNV.map(v=>f(v.g.summary[t].passPct,0)+'% / '+f(v.g.summary[t].fluentPct,0)+'%')]))+
      '<div class="note">Cells show pass% / fluent%. Only the system prompt changed across variants (same questions, injected data, source docs). Overall pass: '+MNV.map(v=>v.label+' '+passPct(v.g)+'%').join(' → ')+'. Cross-lingual EN→MN technical summary is the remaining weak spot.</div>');
    const lastLabel=MNV[MNV.length-1].label;
    if(mnBest.flagged&&mnBest.flagged.length){
      inner += panel('⚠ Remaining flagged Mongolian outputs ('+esc(lastLabel)+') — native-speaker spot-check',
        mnBest.flagged.map(flCard).join('')+'<div class="note">Fluency judged by a non-native model — please verify these.</div>', true);
    }
    window.__after.push(()=>{
      const cols=[C.d,C.c,C.b];
      if(MNV.length>1) barChart(mnAB,tasks.map(t=>lab[t]||t), MNV.map((v,i)=>({label:v.label,data:tasks.map(t=>v.g.summary[t].passPct),backgroundColor:cols[i%3]})),'pass %');
      else barChart(mnAB,tasks.map(t=>lab[t]||t),[{label:'pass %',data:tasks.map(t=>mnBest.summary[t].passPct),backgroundColor:C.b},{label:'fluent %',data:tasks.map(t=>mnBest.summary[t].fluentPct),backgroundColor:C.a}],'%');
    });
  }
  section('Mongolian (Монгол) — load + output quality (prompt A/B)', inner);
}
(window.__after||[]).forEach(fn=>{try{fn();}catch(e){console.error(e);}});
</script>
</body>
</html>
